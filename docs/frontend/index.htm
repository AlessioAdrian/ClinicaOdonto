<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciente 360° | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#01579b">
</head>
<body>
    <header>
        <h1>Paciente 360°</h1>
        <p>Monitoramento de Reativação e Leads</p>
    </header>

    <main class="dashboard">
        <div class="card">
            <h3>Pacientes Contatados</h3>
            <p id="metric-contatados" class="numero">Carregando...</p>
        </div>
        <div class="card">
            <h3>Agendamentos Confirmados (IA)</h3>
            <p id="metric-agendados" class="numero destaque">Carregando...</p>
        </div>
        <div class="card">
            <h3>Pendências na Recepção</h3>
            <p id="metric-pendencias" class="numero alerta">Carregando...</p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
